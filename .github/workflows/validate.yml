name: Validate companion labs
on: [push, pull_request]
jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q chapters scripts
      - run: python scripts/run_all_labs.py
